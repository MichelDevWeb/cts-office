<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" fill="none">
  <defs>
    <linearGradient id="cts-bg" x1="0" y1="0" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="cts-text" x1="160" y1="25" x2="480" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="55%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="cts-tower-left" x1="34" y1="30" x2="70" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="cts-tower-right" x1="70" y1="30" x2="106" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <filter id="cts-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- App Icon Squircle -->
  <rect x="10" y="10" width="120" height="120" rx="28" fill="url(#cts-bg)" filter="url(#cts-shadow)"/>
  <rect x="12" y="12" width="116" height="116" rx="26" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>

  <!-- Isometric 3D HQ Tower -->
  <!-- Roof Diamond -->
  <polygon points="70,26 104,44 70,62 36,44" fill="#FFFFFF"/>
  <!-- Left Facade -->
  <polygon points="36,44 70,62 70,112 36,94" fill="url(#cts-tower-left)"/>
  <!-- Right Facade -->
  <polygon points="104,44 70,62 70,112 104,94" fill="url(#cts-tower-right)"/>

  <!-- Left Facade Windows (IT Office Floors) -->
  <polygon points="43,55 63,65.5 63,72.5 43,62" fill="#1D4ED8"/>
  <polygon points="43,68 63,78.5 63,85.5 43,75" fill="#2563EB"/>
  <polygon points="43,81 63,91.5 63,98.5 43,88" fill="#0284C7"/>

  <!-- Right Facade Windows (Co-living & Server Floors) -->
  <polygon points="97,55 77,65.5 77,72.5 97,62" fill="#0369A1"/>
  <polygon points="97,68 77,78.5 77,85.5 97,75" fill="#0284C7"/>
  <polygon points="97,81 77,91.5 77,98.5 97,88" fill="#0891B2"/>

  <!-- Glowing Cyan AI Sparkle on Roof -->
  <path d="M70,15 L73,23 L81,26 L73,29 L70,37 L67,29 L59,26 L67,23 Z" fill="#38BDF8"/>
  <circle cx="70" cy="26" r="3" fill="#FFFFFF"/>

  <!-- CTS Badge Pill -->
  <rect x="44" y="96" width="52" height="20" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.8"/>
  <text x="70" y="110" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="12.5" letter-spacing="1.5">CTS</text>

  <!-- Brand Typography -->
  <text x="154" y="68" fill="url(#cts-text)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="46" letter-spacing="-0.8">CTS OFFICE</text>
  <text x="156" y="96" fill="#475569" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" letter-spacing="0.4">3D IT WORKSPACE &amp; CO-LIVING · MULTI-AGENT HUB</text>

  <!-- Agent Badges -->
  <g transform="translate(156, 106)">
    <rect x="0" y="0" width="84" height="22" rx="11" fill="#EFF6FF" stroke="#BFDBFE"/>
    <circle cx="12" cy="11" r="4" fill="#06B6D4"/>
    <text x="22" y="15" fill="#1E40AF" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11">Antigravity</text>

    <rect x="92" y="0" width="66" height="22" rx="11" fill="#FFF7ED" stroke="#FED7AA"/>
    <circle cx="104" cy="11" r="4" fill="#F97316"/>
    <text x="114" y="15" fill="#9A3412" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11">Claude</text>

    <rect x="166" y="0" width="98" height="22" rx="11" fill="#F0FDF4" stroke="#BBF7D0"/>
    <circle cx="178" cy="11" r="4" fill="#22C55E"/>
    <text x="188" y="15" fill="#166534" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11">GitHub CI/CD</text>

    <rect x="272" y="0" width="86" height="22" rx="11" fill="#ECFEFF" stroke="#A5F3FC"/>
    <circle cx="284" cy="11" r="4" fill="#0891B2"/>
    <text x="294" y="15" fill="#155E75" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11">24/7 Living</text>
  </g>
</svg>

