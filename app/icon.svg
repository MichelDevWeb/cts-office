<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cts-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="cts-left" x1="14" y1="14" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="cts-right" x1="32" y1="14" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#cts-grad)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="1.5"/>
  <!-- Isometric 3D HQ Tower -->
  <polygon points="32,10 50,19.5 32,29 14,19.5" fill="#FFFFFF"/>
  <polygon points="14,19.5 32,29 32,53 14,43.5" fill="url(#cts-left)"/>
  <polygon points="50,19.5 32,29 32,53 50,43.5" fill="url(#cts-right)"/>
  <!-- Windows Left -->
  <polygon points="18,25.5 28.5,31 28.5,34.8 18,29.3" fill="#1D4ED8"/>
  <polygon points="18,32 28.5,37.5 28.5,41.3 18,35.8" fill="#2563EB"/>
  <!-- Windows Right -->
  <polygon points="46,25.5 35.5,31 35.5,34.8 46,29.3" fill="#0369A1"/>
  <polygon points="46,32 35.5,37.5 35.5,41.3 46,35.8" fill="#0891B2"/>
  <!-- AI Sparkle -->
  <path d="M32,4.5 L33.8,9.2 L38.5,11 L33.8,12.8 L32,17.5 L30.2,12.8 L25.5,11 L30.2,9.2 Z" fill="#38BDF8"/>
  <!-- CTS Pill -->
  <rect x="17" y="43.5" width="30" height="12.5" rx="6.25" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="32" y="52.5" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="8.5" letter-spacing="0.8">CTS</text>
</svg>
